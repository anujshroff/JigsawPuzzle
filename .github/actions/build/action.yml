name: 'Build'
description: 'Build'
inputs:
  CONFIGURATION:
    required: false
    default: 'Release'
  DOTNET_CORE_VERSION:
    required: false
    default: '10.x'
  AZURE_CLIENT_ID:
    required: true
  AZURE_TENANT_ID:
    required: true
  AZURE_SUBSCRIPTION_ID:
    required: true
  TRUSTED_SIGNING_ENDPOINT:
    required: true
  TRUSTED_SIGNING_ACCOUNT:
    required: true
  TRUSTED_SIGNING_CERTIFICATE_PROFILE:
    required: true

runs:
  using: 'composite'
  steps:
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ inputs.DOTNET_CORE_VERSION }}

    - name: Run Branch Release Versioning
      id: nextversion
      uses: ./.github/actions/versioning

    - name: Publish
      run: dotnet publish --configuration ${{ inputs.CONFIGURATION }} -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Version=${{ steps.nextversion.outputs.VERSION }} -p:AssemblyVersion=${{ steps.nextversion.outputs.ASSEMBLYSEMVER }}
      shell: bash

    - name: Azure Login
      uses: azure/login@v3
      with:
        client-id: ${{ inputs.AZURE_CLIENT_ID }}
        tenant-id: ${{ inputs.AZURE_TENANT_ID }}
        subscription-id: ${{ inputs.AZURE_SUBSCRIPTION_ID }}

    - name: Sign files with Artifact Signing
      uses: azure/artifact-signing-action@v2
      with:
        endpoint: ${{ inputs.TRUSTED_SIGNING_ENDPOINT }}
        signing-account-name: ${{ inputs.TRUSTED_SIGNING_ACCOUNT }}
        certificate-profile-name: ${{ inputs.TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
        files: ${{ github.workspace }}/bin/${{ inputs.CONFIGURATION }}/net10.0/win-x64/publish/JigsawPuzzle.exe
        file-digest: SHA256
        timestamp-rfc3161: http://timestamp.acs.microsoft.com
        timestamp-digest: SHA256

    - name: Stage Release Asset
      run: cp "bin/${{ inputs.CONFIGURATION }}/net10.0/win-x64/publish/JigsawPuzzle.exe" "JigsawPuzzle-${{ steps.nextversion.outputs.VERSION }}-win-x64.exe"
      shell: bash

    - name: Create GitHub Release
      run: |
        gh release create "v${{ steps.nextversion.outputs.VERSION }}" \
          "JigsawPuzzle-${{ steps.nextversion.outputs.VERSION }}-win-x64.exe" \
          --title "v${{ steps.nextversion.outputs.VERSION }}" \
          --generate-notes \
          --target "${{ github.sha }}"
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
